<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Construction Closeout Checklist</title><style>
:root{
  --navy:#0f3157;--navy2:#194f80;--cream:#f7f0e5;--paper:#fffdf8;
  --olive:#727b60;--gold:#c99a43;--line:#c7b9a7;--soft:#edf2e9;
  --ink:#29302f;--muted:#68706d;--danger:#7b3f2d
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.66 Arial,sans-serif}
.wrap{width:min(1160px,calc(100% - 28px));margin:auto} a{color:inherit}
header{position:sticky;top:0;z-index:50;background:#fffdf8f4;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
header .wrap{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:16px 0}
header a{text-decoration:none;color:var(--navy);font-weight:900}.nav{display:flex;gap:13px;flex-wrap:wrap}
.hero{padding:74px 0 46px;background:radial-gradient(circle at 85% 12%,rgba(201,154,67,.20),transparent 28%),radial-gradient(circle at 12% 88%,rgba(114,123,96,.14),transparent 30%),linear-gradient(135deg,var(--paper),var(--soft))}
.eyebrow{color:var(--olive);font-size:.78rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase}
h1,h2,h3,h4{font-family:Georgia,serif;color:var(--navy)} h1{font-size:clamp(3.2rem,8vw,6.2rem);line-height:.93;margin:.18em 0}
.lead{font:1.23rem/1.62 Georgia,serif;color:var(--olive);max-width:900px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.hero-actions a{padding:12px 15px;border:2px solid var(--navy);border-radius:12px;text-decoration:none;font-weight:900;color:var(--navy)}
.hero-actions a:first-child{background:var(--navy);color:#fff}
.notice,.story,.pro,.warning{margin-top:16px;padding:15px 18px;border-radius:9px;border-left:5px solid var(--navy)}
.notice{background:#f5f7fa}.story{background:#fbf6eb;border-color:var(--gold)}.pro{background:var(--soft);border-color:var(--olive)}.warning{background:#f8ece7;border-color:var(--danger)}
.search-zone{background:var(--navy);padding:22px 0}.search-row{display:flex;gap:10px}
.search-row input{width:100%;padding:14px;border:0;border-radius:12px;font:inherit}.search-row button{padding:0 18px;border:0;border-radius:12px;font-weight:900}
section{padding:46px 0}.section-title{font-size:clamp(2.3rem,6vw,4.6rem);margin:.15em 0 24px}
.dashboard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 10px 28px rgba(15,49,87,.05);cursor:pointer;transition:.18s}
.tile:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(15,49,87,.11)}.tile h3{font-size:1.5rem;margin:.15em 0 .45em}.tile p{color:var(--muted);margin:0}.open-label{display:inline-block;margin-top:12px;color:var(--navy);font-weight:900}
.panel{display:none;margin:16px 0 26px;background:linear-gradient(145deg,#fff,#f7faf5);border:1px solid var(--line);border-radius:18px;padding:20px}
.panel.open{display:block;animation:open .2s ease}@keyframes open{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.grid,.grid3,.grid4{display:grid;gap:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:#fff;border:1px solid #d8ded2;border-radius:14px;padding:15px}.card h3,.card h4{margin:.05em 0 .4em}.card p{color:var(--muted);margin:0}.card a{color:var(--navy);font-weight:900}
.workflow{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.workflow a{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;text-decoration:none;font-weight:900;color:var(--navy)}
.checks{display:grid;gap:9px}.check{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px}.check input{margin-top:4px;transform:scale(1.2)}
.progressrow{display:flex;justify-content:space-between;font-weight:900;color:var(--navy)}.bar{height:10px;background:#e4e9df;border-radius:999px;overflow:hidden;margin:8px 0 13px}.bar span{display:block;height:100%;width:0;background:var(--olive)}
.calc{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:18px;padding:20px}.calc h2,.calc h3{color:#fff}
.fieldgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-weight:900;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:0;border-radius:9px;font:inherit}
.results{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.result{background:#ffffff17;border:1px solid #ffffff30;border-radius:12px;padding:12px}.result strong{display:block;font-size:1.3rem}
.atlas{display:flex;flex-wrap:wrap;gap:8px}.atlas a{background:var(--soft);border:1px solid #d4dacd;border-radius:999px;padding:9px 12px;color:var(--navy);font-weight:900;text-decoration:none}
.tool-links{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tool-links a{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--navy);font-weight:900;text-decoration:none}
.lesson-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:24px}.lesson-nav a{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;text-align:center;color:var(--navy);font-weight:900;text-decoration:none}
footer{padding:34px 0;color:var(--muted);border-top:1px solid var(--line)}
@media(max-width:920px){.dashboard{grid-template-columns:repeat(2,1fr)}.workflow{grid-template-columns:repeat(3,1fr)}.grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.nav{display:none}.dashboard,.grid,.grid3,.grid4,.fieldgrid,.results,.tool-links,.lesson-nav{grid-template-columns:1fr}.workflow{grid-template-columns:repeat(2,1fr)}.search-row{flex-direction:column}.search-row button{padding:12px}}

.tool-shell{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 10px 28px rgba(15,49,87,.05)}
.printbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.printbar button,.printbar a{border:0;background:var(--navy);color:white;padding:11px 14px;border-radius:10px;font-weight:900;text-decoration:none;cursor:pointer}
textarea{min-height:110px}
@media print{header,.hero,.search-zone,.printbar,footer{display:none!important}body{background:white}.tool-shell{border:0;box-shadow:none;padding:0}}
</style></head><body>
<header><div class='wrap'><a href='index.html'>✦ The Everyday Investor Academy</a><nav class='nav'><a href='construction.html'>Construction</a><a href='construction-toolkit.html'>Toolkit</a><a href='c-001.html'>C-001</a></nav></div></header>
<section class='hero'><div class='wrap'><div class='eyebrow'>Construction working tool</div><h1>Construction Closeout Checklist</h1><p class='lead'>Finish the job, records, customer handoff, payment, warranty, and internal review.</p></div></section>
<section><div class='wrap'><article class='tool-shell'><div class='printbar'><button onclick='window.print()'>Print / Save PDF</button><a href='construction-toolkit.html'>All tools</a></div>
<div class='fieldgrid'><div class='field'><label>Project</label><input></div><div class='field'><label>Closeout date</label><input></div></div>
<div class='checks'>
<label class='check'><input type='checkbox'>Final scope reviewed</label><label class='check'><input type='checkbox'>Approved changes included</label><label class='check'><input type='checkbox'>Punch list complete</label><label class='check'><input type='checkbox'>Final inspection / approvals saved</label><label class='check'><input type='checkbox'>Final photos saved</label><label class='check'><input type='checkbox'>Manuals and warranties delivered</label><label class='check'><input type='checkbox'>Customer care instructions provided</label><label class='check'><input type='checkbox'>Final invoice sent</label><label class='check'><input type='checkbox'>Payment received / tracked</label><label class='check'><input type='checkbox'>Review or referral requested</label>
</div><div class='field'><label>Warranty and maintenance notes</label><textarea></textarea></div><div class='field'><label>Internal lessons learned</label><textarea></textarea></div></article></div></section>
<footer><div class='wrap'>© 2026 The Everyday Investor Academy · Construction Toolkit</div></footer><script></script></body></html>
